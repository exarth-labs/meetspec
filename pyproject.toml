[project]
name = "exarth-meetings"
version = "0.1.0"
description = "Transcribe client calls locally, turn them into requirements, and check code against them."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "faster-whisper>=1.1.0",
]

[project.scripts]
meetings = "meetings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetings"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
