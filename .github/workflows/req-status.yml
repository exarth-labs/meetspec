name: Requirements status

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  req-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check requirements against code
        run: python scripts/req_status.py --check
      - name: Show report in the job summary
        if: always()
        run: cat docs/STATUS.md >> "$GITHUB_STEP_SUMMARY"
