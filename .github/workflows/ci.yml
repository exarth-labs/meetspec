name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # Hugging Face rate-limits anonymous downloads from shared CI runners (HTTP 429),
      # so keep the small test model between runs instead of downloading it every time.
      - name: Cache the test model
        uses: actions/cache@v4
        with:
          # the whole hub folder: newer huggingface_hub keeps large files in a shared hub/blobs/
          path: ~/.cache/huggingface/hub
          key: hf-hub-tiny.en-${{ runner.os }}-v2
      - name: Run tests (including a real transcription)
        run: uv run pytest -q -rs
        env:
          RUN_E2E: "1"
      - name: CLI smoke test
        run: |
          uv run meetings --version
          uv run meetings transcribe --help
